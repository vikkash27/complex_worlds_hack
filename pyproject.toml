[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robocerebra-rl"
version = "0.1.0"
description = "OpenReward benchmark slice for long-horizon physical-AI planning with dense VLM rewards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "openreward>=0.1.89",
  "pillow>=10.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "packaging>=23.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: needs PyPI; opt-in with PYPI_CHECK=1 (see test_openreward_packaging)",
]
